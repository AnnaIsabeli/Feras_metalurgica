name: Android development build
on:
  workflow_dispatch:
  push:
    branches: [feature/kan-50-android]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Prepare Android platform in isolated temporary project
        run: |
          flutter create --platforms=android --org shop.orcex --project-name fera_mobile "$RUNNER_TEMP/orcex_android"
          cp -R "$RUNNER_TEMP/orcex_android/android" apps/mobile/android
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - name: Build development APK against HTTPS API
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define=ENABLE_DEMO=true --dart-define=API_BASE_URL=https://dev.orcex.shop/api
      - uses: actions/upload-artifact@v4
        with:
          name: orcex-android-development
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/android
          retention-days: 7
