name: Validate architecture

on: [push, pull_request]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fera
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: fera_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fera -d fera_test"
          --health-interval 5s --health-timeout 3s --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql://fera:ci_only_password@localhost:5432/fera_test?sslmode=disable
      PGPASSWORD: ci_only_password

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - run: psql -h localhost -U fera -d fera_test -v ON_ERROR_STOP=1 -f database/migrations/001_initial.sql -f database/seeds/development.sql

      - run: dart pub get
        working-directory: services/api

      - run: dart analyze --fatal-infos
        working-directory: services/api

      - run: dart test
        working-directory: services/api

  flutter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: apps/mobile

      - run: flutter analyze
        working-directory: apps/mobile

      - run: flutter test
        working-directory: apps/mobile

      - run: flutter build web
        working-directory: apps/mobile

  deploy-dev:
    name: Deploy DEV
    needs: [api, flutter]

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    concurrency:
      group: fera-dev-deploy
      cancel-in-progress: false

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy DEV
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'sudo /usr/local/bin/deploy-fera-dev'
