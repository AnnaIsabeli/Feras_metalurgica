name: fera_mobile
description: Aplicativo Flutter Fera Metalúrgica.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  fera_contracts:
    path: ../../packages/contracts
  http: ^1.4.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  printing: 5.14.3
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/login-background.png
    - assets/brand/fera-mark-source.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
