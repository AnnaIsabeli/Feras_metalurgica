services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fera}
      POSTGRES_USER: ${POSTGRES_USER:-fera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fera}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fera}?sslmode=disable
      APP_ENV: ${APP_ENV:-production}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      HOST: 0.0.0.0
      PORT: 8080
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
